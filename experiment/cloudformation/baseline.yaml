AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DriftFinder Controlled Experiment - CloudFormation Baseline Environment.
  Provisions all 8 resource types in CIS-compliant initial state.
  Region: eu-west-1

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID used in globally unique bucket names

  DBPassword:
    Type: String
    NoEcho: true
    Description: RDS master password

Resources:

  # ── KMS KEY ────────────────────────────────────────────────────────────
  DriftFinderKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: DriftFinder experiment KMS key
      Enabled: true
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudTrail to use key
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:Decrypt
            Resource: '*'
      Tags:
        - Key: Name
          Value: driftfinder-kms-test
        - Key: Environment
          Value: driftfinder-experiment
        - Key: IaCTool
          Value: cloudformation

  DriftFinderKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/driftfinder-test-cf
      TargetKeyId: !Ref DriftFinderKMSKey

  # ── CLOUDTRAIL LOG BUCKET ──────────────────────────────────────────────
  CloudTrailLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub 'driftfinder-ct-logs-${AccountId}-cf'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: driftfinder-cloudtrail-logs-cf

  CloudTrailLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailLogBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailLogBucket.Arn}/AWSLogs/${AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control

  # ── CLOUDWATCH LOG GROUP FOR CLOUDTRAIL ───────────────────────────────
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /driftfinder/cloudtrail-cf
      RetentionInDays: 7

  CloudTrailCWRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: driftfinder-cloudtrail-cw-cf
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailCWPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${CloudTrailLogGroup.Arn}:*'

  # ── CLOUDTRAIL ─────────────────────────────────────────────────────────
  DriftFinderTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailLogBucketPolicy
    Properties:
      TrailName: driftfinder-trail-test-cf
      S3BucketName: !Ref CloudTrailLogBucket
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailCWRole.Arn
      KMSKeyId: !Ref DriftFinderKMSKey
      IsLogging: true
      Tags:
        - Key: Name
          Value: driftfinder-trail-test-cf
        - Key: Environment
          Value: driftfinder-experiment
        - Key: IaCTool
          Value: cloudformation

  # ── TEST S3 BUCKET ─────────────────────────────────────────────────────
  DriftFinderS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub 'driftfinder-s3-test-${AccountId}-cf'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref CloudTrailLogBucket
        LogFilePrefix: s3-access-logs/
      Tags:
        - Key: Name
          Value: driftfinder-s3-test
        - Key: Environment
          Value: driftfinder-experiment
        - Key: IaCTool
          Value: cloudformation

  # ── VPC ────────────────────────────────────────────────────────────────
  DriftFinderVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.101.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: driftfinder-vpc-test
        - Key: Environment
          Value: driftfinder-experiment
        - Key: IaCTool
          Value: cloudformation

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DriftFinderVPC
      CidrBlock: 10.101.1.0/24
      AvailabilityZone: eu-west-1a
      Tags:
        - Key: Name
          Value: driftfinder-subnet-a-cf

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DriftFinderVPC
      CidrBlock: 10.101.2.0/24
      AvailabilityZone: eu-west-1b
      Tags:
        - Key: Name
          Value: driftfinder-subnet-b-cf

  # ── VPC FLOW LOGS ──────────────────────────────────────────────────────
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /driftfinder/vpc-flow-logs-cf
      RetentionInDays: 7

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: driftfinder-flow-logs-cf
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: '*'

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref DriftFinderVPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - Key: Name
          Value: driftfinder-flow-log-cf

  # ── NETWORK ACL (D21) ─────────────────────────────────────────────────
  DriftFinderNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref DriftFinderVPC
      Tags:
        - Key: Name
          Value: driftfinder-nacl-cf

  NACLIngressHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DriftFinderNACL
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  NACLIngressEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DriftFinderNACL
      RuleNumber: 200
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  NACLEgressAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DriftFinderNACL
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  SubnetANACLAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref SubnetA
      NetworkAclId: !Ref DriftFinderNACL

  SubnetBNACLAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref SubnetB
      NetworkAclId: !Ref DriftFinderNACL

  # ── SECURITY GROUP ─────────────────────────────────────────────────────
  DriftFinderSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: driftfinder-sg-test-cf
      GroupDescription: DriftFinder experiment security group - compliant baseline
      VpcId: !Ref DriftFinderVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/8
          Description: HTTPS from internal only
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound only
      Tags:
        - Key: Name
          Value: driftfinder-sg-test-cf
        - Key: Environment
          Value: driftfinder-experiment
        - Key: IaCTool
          Value: cloudformation

  # ── IAM POLICY ─────────────────────────────────────────────────────────
  DriftFinderIAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: driftfinder-iam-test-cf
      Description: DriftFinder experiment IAM policy - compliant baseline
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ReadOnly
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - arn:aws:s3:::driftfinder-*
              - arn:aws:s3:::driftfinder-*/*
          - Sid: ExplicitDenyDestructive
            Effect: Deny
            Action:
              - s3:DeleteObject
              - s3:DeleteBucket
            Resource: '*'

  # ── RDS SUBNET GROUP ───────────────────────────────────────────────────
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: DriftFinder RDS subnet group CF
      DBSubnetGroupName: driftfinder-rds-subnet-cf
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB
      Tags:
        - Key: Name
          Value: driftfinder-rds-subnet-cf

  # ── RDS INSTANCE ───────────────────────────────────────────────────────
  DriftFinderRDS:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: driftfinder-rds-test-cf
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: '8.4'
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: '20'
      StorageEncrypted: true
      KmsKeyId: !Ref DriftFinderKMSKey
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !Ref DriftFinderSG
      Tags:
        - Key: Name
          Value: driftfinder-rds-test-cf
        - Key: Environment
          Value: driftfinder-experiment
        - Key: IaCTool
          Value: cloudformation

  # ── EBS VOLUME ─────────────────────────────────────────────────────────
  DriftFinderEBS:
    Type: AWS::EC2::Volume
    DeletionPolicy: Delete
    Properties:
      AvailabilityZone: eu-west-1a
      Size: 1
      VolumeType: gp2
      Encrypted: true
      KmsKeyId: !Ref DriftFinderKMSKey
      Tags:
        - Key: Name
          Value: driftfinder-ebs-test-cf
        - Key: Environment
          Value: driftfinder-experiment
        - Key: IaCTool
          Value: cloudformation

Outputs:
  S3BucketName:
    Value: !Ref DriftFinderS3Bucket
  SecurityGroupId:
    Value: !Ref DriftFinderSG
  IAMPolicyArn:
    Value: !Ref DriftFinderIAMPolicy
  RDSInstanceId:
    Value: !Ref DriftFinderRDS
  EBSVolumeId:
    Value: !Ref DriftFinderEBS
  CloudTrailName:
    Value: !Ref DriftFinderTrail
  VPCId:
    Value: !Ref DriftFinderVPC
  KMSKeyId:
    Value: !Ref DriftFinderKMSKey
  KMSKeyArn:
    Value: !GetAtt DriftFinderKMSKey.Arn
  CTLogBucketName:
    Value: !Ref CloudTrailLogBucket
  CloudTrailCWLogGroupArn:
    Value: !GetAtt CloudTrailLogGroup.Arn
  CloudTrailCWRoleArn:
    Value: !GetAtt CloudTrailCWRole.Arn
  FlowLogRoleArn:
    Value: !GetAtt FlowLogRole.Arn
  VPCFlowLogGroupName:
    Value: !Ref FlowLogGroup
