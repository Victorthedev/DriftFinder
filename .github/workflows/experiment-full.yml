name: Full experiment on real AWS (Docker)

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenarios to run (leave empty for all 24)
        default: ""
      envs:
        description: Environments to run
        default: "terraform cloudformation pulumi"

concurrency:
  group: driftfinder-aws-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
      SCENARIOS: ${{ inputs.scenarios }}
      ENVS: ${{ inputs.envs }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t driftfinder .
      - run: mkdir -p experiment-runs
      - name: Run the experiment inside the Docker image
        run: |
          ARGS="--envs $ENVS --output-dir /work/full --yes"
          if [ -n "$SCENARIOS" ]; then ARGS="$ARGS --scenarios $SCENARIOS"; fi
          docker run --rm --user "$(id -u):$(id -g)" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            -e DRIFTFINDER_IMAGE="$(docker image inspect driftfinder --format '{{.Id}}') git:${GITHUB_SHA}" \
            -v "$PWD/experiment-runs":/work \
            driftfinder driftfinder-experiment run $ARGS
      - name: Make sure nothing is left running
        if: always()
        run: |
          if [ -f experiment-runs/full/run.json ]; then
            docker run --rm --user "$(id -u):$(id -g)" \
              -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
              -v "$PWD/experiment-runs":/work \
              driftfinder driftfinder-experiment teardown /work/full
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experiment-full
          path: |
            experiment-runs/full
            !experiment-runs/**/secrets.json
            !experiment-runs/**/work/**
          if-no-files-found: ignore
