name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/integration --cov=driftfinder --cov-report=xml
      - uses: codecov/codecov-action@v3

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock --no-deps --disable-pip

  native-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - uses: pulumi/actions@v6
        with:
          pulumi-version: "3.250.0"
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - run: pip install --no-deps -e .
      - run: driftfinder --version
      - run: python experiment/run.py --help
      - name: Check installed versions match the pinned versions
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'experiment')
          import run
          versions, blocking, warnings = run.check_versions()
          print({k: versions[k] for k in ('python', 'terraform', 'pulumi', 'driftfinder')})
          print('\n'.join(blocking + warnings) or 'All versions match')
          sys.exit(1 if blocking or warnings else 0)
          "
      - run: terraform -chdir=experiment/terraform init -backend=false -input=false
      - run: terraform -chdir=experiment/terraform validate
      - run: pytest tests/unit tests/integration -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t driftfinder .
      - run: docker run --rm driftfinder driftfinder --version
      - run: docker run --rm driftfinder driftfinder-experiment --help
      - run: docker run --rm driftfinder pytest /app/tests/unit /app/tests/integration -p no:cacheprovider
